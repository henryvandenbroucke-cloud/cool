<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <meta name="description" content="A plain, simple calculator.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      padding: 16px;
    }
    .calculator {
      width: 100%;
      max-width: 320px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 18px;
      text-align: center;
      margin: 0 0 12px;
      font-weight: normal;
    }
    .display {
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: right;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .expression {
      min-height: 18px;
      font-size: 13px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result {
      font-size: 36px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    button {
      height: 56px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f1f1f1;
      font-size: 20px;
      cursor: pointer;
    }
    button:hover { background: #e4e4e4; }
    button:active { background: #d6d6d6; }
    button:focus-visible { outline: 2px solid #333; outline-offset: 2px; }
    .op { background: #e8e8e8; }
    .clear { color: #c0392b; }
    .equals { background: #333; color: #fff; }
    .equals:hover { background: #555; }
    .equals:active { background: #111; }
    .hint {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin: 12px 0 0;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>Calculator</h1>

    <div class="display" aria-live="polite">
      <div class="expression" id="expression">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <button type="button" class="clear" data-action="clear">AC</button>
      <button type="button" data-action="backspace" aria-label="Backspace">⌫</button>
      <button type="button" data-action="percent">%</button>
      <button type="button" class="op" data-operator="/" aria-label="Divide">÷</button>

      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button type="button" class="op" data-operator="*" aria-label="Multiply">×</button>

      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button type="button" class="op" data-operator="-" aria-label="Subtract">−</button>

      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button type="button" class="op" data-operator="+" aria-label="Add">+</button>

      <button type="button" data-action="negate" aria-label="Plus minus">±</button>
      <button type="button" data-digit="0">0</button>
      <button type="button" data-action="decimal">.</button>
      <button type="button" class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>

    <p class="hint">Keyboard works too: numbers, + − * /, Enter, Esc, Backspace</p>
  </main>

  <script>
    var display = document.getElementById('result');
    var expression = document.getElementById('expression');

    var current = '0';        // number being typed / last result
    var first = null;         // stored first operand (number)
    var operator = null;      // '+', '-', '*', '/'
    var waiting = false;      // next digit starts a new number
    var error = false;

    var SYMBOLS = { '+': '+', '-': '−', '*': '×', '/': '÷' };

    function compute(a, b, op) {
      if (op === '+') return a + b;
      if (op === '-') return a - b;
      if (op === '*') return a * b;
      if (op === '/') return b === 0 ? NaN : a / b;
      return b;
    }

    function format(n) {
      if (isNaN(n) || !isFinite(n)) return 'Error';
      var rounded = Math.round(n * 1e12) / 1e12;
      var s = String(rounded);
      if (s.length > 14) s = rounded.toPrecision(10).replace(/\.?0+$/, '');
      return s;
    }

    function render() {
      display.textContent = current;
      expression.textContent = (first !== null && operator)
        ? format(first) + ' ' + SYMBOLS[operator]
        : '\u00a0';
    }

    function reset() {
      current = '0'; first = null; operator = null; waiting = false; error = false;
      render();
    }

    function inputDigit(d) {
      if (error) reset();
      if (waiting) { current = d; waiting = false; }
      else current = current === '0' ? d : (current.length < 16 ? current + d : current);
      render();
    }

    function inputDecimal() {
      if (error) reset();
      if (waiting) { current = '0.'; waiting = false; }
      else if (current.indexOf('.') === -1) current += '.';
      render();
    }

    function chooseOperator(next) {
      if (error) return;
      var value = parseFloat(current);
      if (first !== null && operator && !waiting) {
        var result = compute(first, value, operator);
        if (isNaN(result) || !isFinite(result)) { current = 'Error'; error = true; first = null; operator = null; render(); return; }
        current = format(result);
        first = result;
      } else {
        first = value;
      }
      operator = next;
      waiting = true;
      render();
    }

    function equals() {
      if (error || first === null || !operator) return;
      var result = compute(first, parseFloat(current), operator);
      expression.textContent = format(first) + ' ' + SYMBOLS[operator] + ' ' + current + ' =';
      if (isNaN(result) || !isFinite(result)) { current = 'Error'; error = true; }
      else current = format(result);
      first = null; operator = null; waiting = true;
      display.textContent = current;
    }

    document.querySelector('.buttons').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      if (btn.dataset.digit) inputDigit(btn.dataset.digit);
      else if (btn.dataset.operator) chooseOperator(btn.dataset.operator);
      else if (btn.dataset.action === 'clear') reset();
      else if (btn.dataset.action === 'decimal') inputDecimal();
      else if (btn.dataset.action === 'equals') equals();
      else if (btn.dataset.action === 'backspace') {
        if (!waiting && !error) { current = current.length > 1 ? current.slice(0, -1) : '0'; if (current === '-') current = '0'; render(); }
      }
      else if (btn.dataset.action === 'percent') {
        if (!error) { current = format(parseFloat(current) / 100); render(); }
      }
      else if (btn.dataset.action === 'negate') {
        if (!error && current !== '0') { current = current.charAt(0) === '-' ? current.slice(1) : '-' + current; render(); }
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
      else if (e.key === '.') inputDecimal();
      else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') { e.preventDefault(); chooseOperator(e.key); }
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
      else if (e.key === 'Escape') reset();
      else if (e.key === '%') { if (!error) { current = format(parseFloat(current) / 100); render(); } }
      else if (e.key === 'Backspace') {
        if (!waiting && !error) { current = current.length > 1 ? current.slice(0, -1) : '0'; if (current === '-') current = '0'; render(); }
      }
    });

    render();
  </script>
</body>
</html>
