<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#16222e">
  <meta name="description" content="Lantern & Lens — a cozy first-person night-shift light shop at the edge of the forest. Stock shelves, craft candles and lamps, and light up the village.">
  <title>Lantern &amp; Lens</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/nunito-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/js/vendor/three/three.module.min.js",
        "three/addons/": "/js/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view" aria-label="Lantern and Lens game view"></canvas>

  <!-- Boot / title -->
  <section id="title" class="screen is-open" aria-labelledby="title-name">
    <div class="title-card">
      <p class="eyebrow">a cozy night-shift shop</p>
      <h1 id="title-name">Lantern <span class="amp">&amp;</span> Lens</h1>
      <p class="title-sub">Stock the shelves. Pour the candles. Light up the village.</p>
      <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="loading-bar"><i id="loading-fill"></i></div>
        <span id="loading-text">Lighting the lamps…</span>
      </div>
      <div id="slots" class="slots" hidden></div>
      <p class="title-foot">Best with headphones · <kbd>WASD</kbd> move · mouse look · <kbd>Click</kbd> use</p>
    </div>
  </section>

  <!-- In-game HUD -->
  <div id="hud" class="hud" hidden>
    <div class="hud-tl">
      <div class="chip clock"><span id="hud-phase" class="phase-dot"></span><b id="hud-time">18:00</b><span id="hud-night">Night 1</span></div>
      <div class="chip weather" id="hud-weather">Clear</div>
    </div>
    <div class="hud-tr">
      <div class="chip coins"><span class="coin-ico" aria-hidden="true"></span><b id="hud-coins">0</b></div>
      <div class="chip level"><span>Lv <b id="hud-level">1</b></span><div class="xpbar"><i id="hud-xp"></i></div></div>
      <div class="chip lit" title="Windows lit in the village"><span class="win-ico" aria-hidden="true"></span><b id="hud-lit">0</b>/<span id="hud-lit-total">0</span></div>
      <button id="btn-menu" class="chip btn-ico" aria-label="Menu">☰</button>
    </div>
    <div id="crosshair" class="crosshair" aria-hidden="true"></div>
    <div id="prompt" class="prompt" aria-live="polite"></div>
    <div id="held" class="held-chip" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="hint" class="hint"></div>
  </div>

  <!-- Touch controls -->
  <div id="touch" class="touch" hidden>
    <div id="stick" class="stick"><i></i></div>
    <div class="touch-btns">
      <button id="t-use" class="tbtn use">Use</button>
      <button id="t-back" class="tbtn">Back</button>
      <button id="t-drop" class="tbtn">Drop</button>
    </div>
  </div>

  <!-- Panels (paper modal) -->
  <div id="panel-wrap" class="panel-wrap" hidden>
    <div id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <header><h2 id="panel-title"></h2><button id="panel-close" class="x" aria-label="Close">×</button></header>
      <div id="panel-body" class="panel-body"></div>
    </div>
  </div>

  <!-- Station overlay (crafting) -->
  <div id="station" class="station" hidden>
    <div class="station-head"><h3 id="station-title"></h3><p id="station-step"></p></div>
    <div id="station-ui" class="station-ui"></div>
    <button id="station-leave" class="btn ghost">Leave bench <kbd>Esc</kbd></button>
  </div>

  <!-- Photo mode -->
  <div id="photo" class="photo" hidden>
    <div class="photo-bar">
      <span>Photo mode — <kbd>WASD</kbd> fly · <kbd>Q</kbd>/<kbd>E</kbd> down/up</span>
      <button id="photo-filter" class="btn ghost">Filter: Warm</button>
      <button id="photo-snap" class="btn">Capture</button>
      <button id="photo-exit" class="btn ghost">Exit <kbd>P</kbd></button>
    </div>
  </div>

  <div id="fade" class="fade"></div>

  <noscript><p class="noscript">Lantern &amp; Lens needs JavaScript and WebGL.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
