<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snake — don't get touched</title>
  <meta name="description" content="A blank screen, a very motivated cartoon snake, and your cursor. Don't let it touch you — hide behind the boulders.">
  <meta name="theme-color" content="#fff7ea">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐍%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/snake.css">
</head>
<body>
  <canvas id="game" aria-label="A snake follows your cursor. Keep moving or hide behind boulders so it never touches you."></canvas>

  <div class="hud" aria-hidden="true">
    <span class="hud__time" id="time">0:00</span>
    <span class="hud__best" id="best">best 0:00</span>
  </div>

  <p class="hint">
    The snake follows your cursor — <strong>don't let it touch you.</strong><br>
    Boulders block the snake, so hide behind them… but it'll come around.
  </p>

  <div class="overlay" id="overlay" hidden>
    <div class="card" role="dialog" aria-labelledby="over-title">
      <div class="card__face" aria-hidden="true">🐍</div>
      <h1 class="card__title" id="over-title">Ouch!</h1>
      <p class="card__line">The snake got you.</p>
      <p class="card__score">You survived <strong id="final-time">0:00</strong></p>
      <p class="card__best" id="card-best">best 0:00</p>
      <button class="card__btn" id="restart" type="button">try again</button>
    </div>
  </div>

  <a class="prism-link" href="/prism" aria-label="Visit PRISM, the other experiment in this repo">PRISM</a>

  <script type="module" src="/js/snake.js"></script>
</body>
</html>
